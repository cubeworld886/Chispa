name: Assemble preview prairie soundtrack

on:
  push:
    branches:
      - lavender-narrative-preview
    paths:
      - assets/music/_prairie_transfer_parts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-soundtrack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: lavender-narrative-preview
          persist-credentials: true
      - name: Reassemble original prairie MP3 from exact Git blobs
        shell: bash
        run: |
          set -euo pipefail
          folder="assets/music/_prairie_transfer_parts"
          mkdir -p assets/music
          test "$(find "$folder" -maxdepth 1 -name 'part-*.bin' -type f | wc -l)" -eq 13
          for i in $(seq -w 0 12); do
            test -s "$folder/part-$i.bin"
          done
          for i in $(seq -w 0 12); do
            cat "$folder/part-$i.bin"
          done > assets/music/viento-en-la-pradera.mp3
          echo "ad51088cd341e03e9c8407bbab1b713234c5702d1b7a93ef235a6c259c3d25f6  assets/music/viento-en-la-pradera.mp3" | sha256sum --check --status
          echo "ffmpeg source verified byte-for-byte (SHA-256)"
          test -s assets/music/yo-quisiera.mp3
          echo "ff050b09181e166381c6082891b4c3709e92f5781ce021356be7c57b053bd4a4  assets/music/yo-quisiera.mp3" | sha256sum --check --status
      - name: Commit originals only, remove upload fragments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music/viento-en-la-pradera.mp3 assets/music/yo-quisiera.mp3
          git rm -rq assets/music/_prairie_transfer_parts
          git commit -m "Install original Chispa prairie and Yo Quisiera recordings without recompression"
          git push origin HEAD:lavender-narrative-preview
